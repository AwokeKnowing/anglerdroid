<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kevin Live Sim</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#ddd;font:14px system-ui;overflow:hidden;height:100vh}
#c{display:block;width:100%;height:100%}
#hud{position:fixed;top:8px;left:8px;background:#0008;padding:6px 10px;border-radius:4px;font-size:12px;pointer-events:none}
#chat{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;display:flex;padding:8px;gap:8px}
#chat input{flex:1;background:#222;border:1px solid #444;color:#fff;padding:8px;font:14px system-ui}
#chat button{background:#0a5;border:none;color:#fff;padding:8px 20px;cursor:pointer;font:14px system-ui}
#chat button:hover{background:#0b6}
#log{position:fixed;bottom:60px;left:8px;right:8px;max-height:200px;overflow:auto;background:#0008;padding:6px;font:11px monospace;white-space:pre-wrap;display:none}
#log.show{display:block}
#controls{position:fixed;top:8px;right:8px;background:#0008;padding:6px;border-radius:4px;display:flex;flex-direction:column;gap:4px}
#controls label{font-size:11px;display:flex;align-items:center;cursor:pointer}
#controls input[type=checkbox]{margin-right:6px}
.cam-panel{position:fixed;background:#000;border:1px solid #666;display:none;pointer-events:none}
.cam-panel.show{display:block}
.cam-panel img{display:block;width:100%;height:100%}
#rs1d-panel{top:60px;left:8px;width:320px;height:240px}
#rs1c-panel{top:310px;left:8px;width:320px;height:240px}
#rs2d-panel{top:60px;right:348px;width:320px;height:240px}
#rs2c-panel{top:310px;right:348px;width:320px;height:240px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">Kevin Live Sim · Drag to orbit · Scroll to zoom</div>
<div id="controls">
<label><input type="checkbox" id="camvis" checked> Camera frustums</label>
<label><input type="checkbox" id="showdog" checked> Show dog</label>
<label><input type="checkbox" id="showlog"> Show log</label>
<label><input type="checkbox" id="rs1d"> RS1 depth</label>
<label><input type="checkbox" id="rs1c"> RS1 color</label>
<label><input type="checkbox" id="rs2d"> RS2 depth</label>
<label><input type="checkbox" id="rs2c"> RS2 color</label>
<button id="framehouse" style="background:#0008;border:1px solid #666;color:#ddd;padding:4px 8px;cursor:pointer;font-size:11px;margin-top:4px">Frame house</button>
</div>
<div id="rs1d-panel" class="cam-panel"><img id="rs1d-img" src="" alt="RS1 depth"></div>
<div id="rs1c-panel" class="cam-panel"><img id="rs1c-img" src="" alt="RS1 color"></div>
<div id="rs2d-panel" class="cam-panel"><img id="rs2d-img" src="" alt="RS2 depth"></div>
<div id="rs2c-panel" class="cam-panel"><img id="rs2c-img" src="" alt="RS2 color"></div>
<div id="log"></div>
<div id="chat">
<input id="q" placeholder="go to couch | forward 2 | turn left | stop" autocomplete="off">
<button id="send">Send</button>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const canvas=document.getElementById('c');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);  // sky blue

const camera=new THREE.PerspectiveCamera(50,window.innerWidth/window.innerHeight,0.1,200);
camera.position.set(-3,2.5,4);

const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const controls=new OrbitControls(camera,canvas);
controls.target.set(0,0,0);
controls.enableDamping=true;
controls.dampingFactor=0.05;
controls.update();

// Lights - bright outdoor lighting
const hemi=new THREE.HemisphereLight(0xffffff,0x666666,0.8);
scene.add(hemi);
const ambient=new THREE.AmbientLight(0xffffff,0.6);
scene.add(ambient);
const dir=new THREE.DirectionalLight(0xffffff,1.0);
dir.position.set(5,10,7);
dir.castShadow=true;
dir.shadow.camera.left=-20;dir.shadow.camera.right=20;
dir.shadow.camera.top=20;dir.shadow.camera.bottom=-20;
dir.shadow.mapSize.width=2048;dir.shadow.mapSize.height=2048;
scene.add(dir);

// Ground - will be resized based on scene extent
let ground=new THREE.Mesh(
  new THREE.PlaneGeometry(30,30),
  new THREE.MeshStandardMaterial({color:0x4a4a4a,roughness:0.8})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// Grid helper for reference
let grid=new THREE.GridHelper(30,30,0x666666,0x444444);
grid.position.y=0.01;
scene.add(grid);

// State
let sceneLoaded=false;
let sceneExtent=null;
let robot=null,frustums=[];
const camvisEl=document.getElementById('camvis');
const showdogEl=document.getElementById('showdog');

// Camera panel controls
const rs1dEl=document.getElementById('rs1d');
const rs1cEl=document.getElementById('rs1c');
const rs2dEl=document.getElementById('rs2d');
const rs2cEl=document.getElementById('rs2c');

rs1dEl.onchange=()=>{document.getElementById('rs1d-panel').classList.toggle('show',rs1dEl.checked)};
rs1cEl.onchange=()=>{document.getElementById('rs1c-panel').classList.toggle('show',rs1cEl.checked)};
rs2dEl.onchange=()=>{document.getElementById('rs2d-panel').classList.toggle('show',rs2dEl.checked)};
rs2cEl.onchange=()=>{document.getElementById('rs2c-panel').classList.toggle('show',rs2cEl.checked)};

// MuJoCo Z-up to Three.js Y-up coordinate transform
function mjToThree(x,y,z){return[x,z,-y]}

// Robot - load GLB mesh, fallback to box placeholder
const robotGroup=new THREE.Group();
let robotMesh=null;
let placeholder=null;

// Placeholder (dark box + mast) - shown until GLB loads
const placeholderGroup=new THREE.Group();
const chassisGeom=new THREE.BoxGeometry(0.5,0.15,0.4);
const chassisMat=new THREE.MeshStandardMaterial({color:0x2a2e33,roughness:0.7});
const chassis=new THREE.Mesh(chassisGeom,chassisMat);
chassis.position.y=0.075;
chassis.castShadow=true;
placeholderGroup.add(chassis);
const mastGeom=new THREE.CylinderGeometry(0.03,0.03,0.15,8);
const mastMat=new THREE.MeshStandardMaterial({color:0x2a2e33,roughness:0.7});
const mast=new THREE.Mesh(mastGeom,mastMat);
mast.position.set(0,0.15+0.075,0);
mast.castShadow=true;
placeholderGroup.add(mast);
placeholder=placeholderGroup;
robotGroup.add(placeholder);

// Yellow heading arrow (always visible)
const arrowHelper=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(0,0.1,0),0.5,0xffff00,0.15,0.1);
robotGroup.add(arrowHelper);

robot=robotGroup;
scene.add(robot);

// Load GLB mesh
const loader=new GLTFLoader();
loader.load('/assets/kevin_lite.glb',
  (gltf)=>{
    console.log('GLB loaded successfully');
    robotMesh=gltf.scene;
    // Real mesh is Y-up in metres; lift so wheels sit on floor (wheels at Y ≈ -0.086)
    robotMesh.position.y=0.086;
    robotMesh.traverse((child)=>{
      if(child.isMesh){
        child.castShadow=true;
        child.receiveShadow=true;
      }
    });
    robotGroup.add(robotMesh);
    // Hide placeholder
    if(placeholder){
      robotGroup.remove(placeholder);
      placeholder=null;
    }
  },
  (progress)=>{
    console.log('Loading GLB:',Math.round(progress.loaded/progress.total*100)+'%');
  },
  (error)=>{
    console.error('Failed to load GLB:',error);
    // Keep placeholder visible on error
  }
);

// Dog (yorkie) - matching MuJoCo sim geometry from world.py lines 197-206
// Materials: fur-like brown colors
const furMat=new THREE.MeshStandardMaterial({color:0x8c6540,roughness:0.9});
const fur2Mat=new THREE.MeshStandardMaterial({color:0x7a5530,roughness:0.9});

const dogGroup=new THREE.Group();
dogGroup.visible=false;

// Body: capsule from (-0.07,0,0.13) to (0.06,0,0.135), radius 0.055
const bodyGeom=new THREE.CapsuleGeometry(0.055,0.13,8,16);
const bodyMesh=new THREE.Mesh(bodyGeom,fur2Mat);
bodyMesh.position.set(-0.005,0.1325,0);
bodyMesh.rotation.z=Math.PI/2;
bodyMesh.castShadow=true;
dogGroup.add(bodyMesh);

// Head: sphere at (0.11,0,0.175), radius 0.048
const headGeom=new THREE.SphereGeometry(0.048,16,16);
const headMesh=new THREE.Mesh(headGeom,furMat);
headMesh.position.set(0.11,0.175,0);
headMesh.castShadow=true;
dogGroup.add(headMesh);

// Snout: capsule from (0.14,0,0.165) to (0.17,0,0.16), radius 0.018
const snoutGeom=new THREE.CapsuleGeometry(0.018,0.03,6,8);
const snoutMesh=new THREE.Mesh(snoutGeom,furMat);
snoutMesh.position.set(0.155,0.1625,0);
snoutMesh.rotation.z=Math.PI/2;
snoutMesh.castShadow=true;
dogGroup.add(snoutMesh);

// Ears: boxes at (0.105,±0.028,0.225), size (0.012,0.008,0.022)
for(let ex of[-1,1]){
  const earGeom=new THREE.BoxGeometry(0.024,0.044,0.016);
  const earMesh=new THREE.Mesh(earGeom,fur2Mat);
  earMesh.position.set(0.105,0.225,0.028*ex);
  earMesh.castShadow=true;
  dogGroup.add(earMesh);
}

// Legs: 4 capsules at corners (±0.07,±0.03), from z=0.11 to z=0.012, radius 0.013
for(let lx of[-0.07,0.07]){
  for(let ly of[-0.03,0.03]){
    const legGeom=new THREE.CapsuleGeometry(0.013,0.098,6,8);
    const legMesh=new THREE.Mesh(legGeom,furMat);
    legMesh.position.set(lx,0.061,ly);
    legMesh.castShadow=true;
    dogGroup.add(legMesh);
  }
}

// Tail: capsule from (-0.11,0,0.15) to (-0.15,0,0.2), radius 0.01
const tailGeom=new THREE.CapsuleGeometry(0.01,0.064,6,8);
const tailMesh=new THREE.Mesh(tailGeom,fur2Mat);
tailMesh.position.set(-0.13,0.175,0);
tailMesh.rotation.z=-Math.atan2(0.05,0.04);
tailMesh.castShadow=true;
dogGroup.add(tailMesh);

scene.add(dogGroup);
showdogEl.onchange=()=>{if(!dogGroup.userData.present)dogGroup.visible=false;else dogGroup.visible=showdogEl.checked};

// Goal marker
const goalGeom=new THREE.ConeGeometry(0.08,0.25,8);
const goalMat=new THREE.MeshStandardMaterial({color:0xf00,emissive:0x800});
const goal=new THREE.Mesh(goalGeom,goalMat);
goal.position.y=0.125;
goal.visible=false;
scene.add(goal);

// Path line
const pathMat=new THREE.LineBasicMaterial({color:0xfa0,linewidth:2});
const path=new THREE.Line(new THREE.BufferGeometry(),pathMat);
scene.add(path);

// Camera frustums with real geometry from twin
// RS1 (top-down D435): pos (-0.007, 0.0, 0.8619), fovy 58°, optical axes: x=-base_x, y=-base_z, z=-base_y
// RS2 (forward D435i): pos (-0.1301, 0.0, 0.3822), pitch ~30° down, fovy 58°
const RS1_POS=[-0.007,0.8619,0];  // MuJoCo (x,z,-y)
const RS2_POS=[-0.1301,0.3822,0];
const FOVY_D=58.0;  // depth FOV degrees
const FOVY_C=42.0;  // color FOV degrees

function makeFrustum(name,pos,fovy,color,pitch){
  const group=new THREE.Group();
  const aspect=848/480;  // D435 resolution
  const depth=0.1;  // small frustum ~10cm deep
  const halfY=Math.tan(fovy*Math.PI/180/2)*depth;
  const halfX=halfY*aspect;
  
  // Wireframe pyramid
  const mat=new THREE.LineBasicMaterial({color,transparent:true,opacity:0.5});
  const points=[
    new THREE.Vector3(0,0,0),new THREE.Vector3(-halfX,-halfY,-depth),
    new THREE.Vector3(0,0,0),new THREE.Vector3(halfX,-halfY,-depth),
    new THREE.Vector3(0,0,0),new THREE.Vector3(halfX,halfY,-depth),
    new THREE.Vector3(0,0,0),new THREE.Vector3(-halfX,halfY,-depth),
    new THREE.Vector3(-halfX,-halfY,-depth),new THREE.Vector3(halfX,-halfY,-depth),
    new THREE.Vector3(halfX,-halfY,-depth),new THREE.Vector3(halfX,halfY,-depth),
    new THREE.Vector3(halfX,halfY,-depth),new THREE.Vector3(-halfX,halfY,-depth),
    new THREE.Vector3(-halfX,halfY,-depth),new THREE.Vector3(-halfX,-halfY,-depth)
  ];
  const geom=new THREE.BufferGeometry().setFromPoints(points);
  const line=new THREE.LineSegments(geom,mat);
  group.add(line);
  
  // Cross-section plane for live image (near the tip)
  const planeGeom=new THREE.PlaneGeometry(halfX*2*0.9,halfY*2*0.9);
  const planeMat=new THREE.MeshBasicMaterial({color:0x444444,side:THREE.DoubleSide,transparent:true,opacity:0.3});
  const plane=new THREE.Mesh(planeGeom,planeMat);
  plane.position.z=-depth*0.9;
  group.add(plane);
  
  group.position.set(...pos);
  // RS1 looks down (optical -z = base -y): rotate -90° around x
  // RS2 looks forward with pitch down: rotate pitch around local x
  if(pitch!==0){
    group.rotation.x=-pitch*Math.PI/180;
  }else{
    group.rotation.x=-Math.PI/2;  // RS1 down
  }
  group.visible=false;
  return group;
}

// Create frustums for RS1 depth, RS1 color, RS2 depth, RS2 color
const rs1dFrustum=makeFrustum('rs1_depth',RS1_POS,FOVY_D,0x00ffff,0);
const rs1cFrustum=makeFrustum('rs1_color',[0.008,0.8619,0],FOVY_C,0x00ff00,0);
const rs2dFrustum=makeFrustum('rs2_depth',RS2_POS,FOVY_D,0xffff00,30);
const rs2cFrustum=makeFrustum('rs2_color',[-0.1301,0.3822,0.015],FOVY_C,0xff00ff,30);

// Add to robot group so they move with the robot
robotGroup.add(rs1dFrustum);
robotGroup.add(rs1cFrustum);
robotGroup.add(rs2dFrustum);
robotGroup.add(rs2cFrustum);

// Populate frustums array (FIX: this was empty, breaking the toggle)
frustums=[rs1dFrustum,rs1cFrustum,rs2dFrustum,rs2cFrustum];

camvisEl.onchange=()=>{frustums.forEach(f=>f.visible=camvisEl.checked&&sceneLoaded)};
showdogEl.onchange();

// Frame house button
function frameHouse(){
  if(!sceneExtent)return;
  const[xmin,ymin,xmax,ymax]=sceneExtent;
  const w=xmax-xmin,h=ymax-ymin;
  const cx=(xmin+xmax)/2,cy=(ymin+ymax)/2;
  const dist=Math.max(w,h)*0.8;
  camera.position.set(cx-dist*0.6,dist*0.5,cy+dist*0.6);
  controls.target.set(cx,0,cy);
  controls.update();
}
document.getElementById('framehouse').onclick=frameHouse;

// Load scene geometry
async function loadScene(){
  try{
    const res=await fetch('/scene.json');
    const data=await res.json();
    console.log('Scene data:',data);
    
    // Update floor and grid based on extent
    if(data.extent){
      sceneExtent=data.extent;
      const[xmin,ymin,xmax,ymax]=data.extent;
      const w=xmax-xmin,h=ymax-ymin;
      const cx=(xmin+xmax)/2,cy=(ymin+ymax)/2;
      console.log(`Scene extent: ${w.toFixed(1)}m x ${h.toFixed(1)}m @ (${cx.toFixed(1)}, ${cy.toFixed(1)})`);
      
      // Resize ground - larger than scene
      scene.remove(ground);
      const groundSize=Math.max(w,h)+8;
      ground=new THREE.Mesh(
        new THREE.PlaneGeometry(groundSize,groundSize),
        new THREE.MeshStandardMaterial({color:0x4a4a4a,roughness:0.8})
      );
      ground.rotation.x=-Math.PI/2;
      ground.position.set(cx,0,cy);
      ground.receiveShadow=true;
      scene.add(ground);
      
      // Resize grid
      scene.remove(grid);
      grid=new THREE.GridHelper(groundSize,Math.ceil(groundSize),0x666666,0x444444);
      grid.position.set(cx,0.01,cy);
      scene.add(grid);
      
      // Auto-frame on load
      frameHouse();
    }
    
    // Add geometry from scene
    let meshCount=0,boxCount=0,cylCount=0;
    data.geoms.forEach(g=>{
      if(g.kind==='box'){
        boxCount++;
        const geom=new THREE.BoxGeometry(g.size[0]*2,g.size[2]*2,g.size[1]*2);
        const color=g.color||0x888888;
        const mat=new THREE.MeshStandardMaterial({color,roughness:0.7});
        const mesh=new THREE.Mesh(geom,mat);
        const[x,y,z]=mjToThree(g.pos[0],g.pos[1],g.pos[2]);
        mesh.position.set(x,y,z);
        mesh.rotation.y=-g.yaw;
        mesh.castShadow=true;
        mesh.receiveShadow=true;
        scene.add(mesh);
      }else if(g.kind==='cyl'){
        cylCount++;
        const geom=new THREE.CylinderGeometry(g.size[0],g.size[0],g.size[1]*2,16);
        const color=g.color||0x888888;
        const mat=new THREE.MeshStandardMaterial({color,roughness:0.6});
        const mesh=new THREE.Mesh(geom,mat);
        const[x,y,z]=mjToThree(g.pos[0],g.pos[1],g.pos[2]);
        mesh.position.set(x,y,z);
        mesh.castShadow=true;
        mesh.receiveShadow=true;
        scene.add(mesh);
      }else if(g.kind==='mesh'&&g.vertices&&g.faces){
        // Mesh (e.g. walls from trimesh)
        meshCount++;
        console.log(`Loading mesh: ${g.vertices.length} verts, ${g.faces.length} faces`);
        const geom=new THREE.BufferGeometry();
        const verts=[];const norms=[];
        g.faces.forEach(f=>{
          const v0=g.vertices[f[0]],v1=g.vertices[f[1]],v2=g.vertices[f[2]];
          const[x0,y0,z0]=mjToThree(v0[0],v0[1],v0[2]);
          const[x1,y1,z1]=mjToThree(v1[0],v1[1],v1[2]);
          const[x2,y2,z2]=mjToThree(v2[0],v2[1],v2[2]);
          verts.push(x0,y0,z0,x1,y1,z1,x2,y2,z2);
          // Compute normal
          const a=new THREE.Vector3(x1-x0,y1-y0,z1-z0);
          const b=new THREE.Vector3(x2-x0,y2-y0,z2-z0);
          const n=new THREE.Vector3().crossVectors(a,b).normalize();
          norms.push(n.x,n.y,n.z,n.x,n.y,n.z,n.x,n.y,n.z);
        });
        geom.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
        geom.setAttribute('normal',new THREE.Float32BufferAttribute(norms,3));
        const color=g.color||0xdcd8cc;
        const mat=new THREE.MeshStandardMaterial({color,roughness:0.7,side:THREE.DoubleSide,transparent:true,opacity:0.88});
        const mesh=new THREE.Mesh(geom,mat);
        mesh.castShadow=true;
        mesh.receiveShadow=true;
        scene.add(mesh);
      }
    });
    console.log(`Scene loaded: ${meshCount} meshes, ${boxCount} boxes, ${cylCount} cylinders`);
    
    sceneLoaded=true;
  }catch(e){
    console.error('Failed to load scene:',e);
  }
}

// Polled state (tunnel-friendly)
function updateState(st){
  try{
    // Update robot
    if(st.kevin){
      const[x,y,z]=mjToThree(st.kevin[0],st.kevin[1],0);
      robot.position.set(x,y,z);
      robot.rotation.y=st.kevin[2];
    }
    
    // Update dog
    if(st.dog&&st.dog.length>=3){
      const[x,y,th]=st.dog;
      const[dx,dy,dz]=mjToThree(x,y,0);
      dogGroup.position.set(dx,dy,dz);
      dogGroup.rotation.y=th;
      dogGroup.userData.present=true;
      dogGroup.visible=showdogEl.checked;
    }else{
      dogGroup.userData.present=false;
      dogGroup.visible=false;
    }
    
    // Update goal
    if(st.goal){
      const[x,y,z]=mjToThree(st.goal[0],st.goal[1],0);
      goal.position.set(x,0.125,z);
      goal.visible=true;
    }else{
      goal.visible=false;
    }
    
    // Update path
    if(st.path&&st.path.length>0){
      const points=st.path.map(p=>{
        const[x,y,z]=mjToThree(p[0],p[1],0);
        return new THREE.Vector3(x,0.02,z);
      });
      path.geometry.dispose();
      path.geometry=new THREE.BufferGeometry().setFromPoints(points);
      path.visible=true;
    }else{
      path.visible=false;
    }
    
  }catch(e){console.error('State update error:',e)}
}

async function pollState(){
  try{
    const res=await fetch('/state.json');
    const st=await res.json();
    updateState(st);
  }catch(e){console.error('Poll error:',e)}
  setTimeout(pollState,50);
}

// Chat
const qEl=document.getElementById('q');
const sendBtn=document.getElementById('send');
const logEl=document.getElementById('log');
const showlogEl=document.getElementById('showlog');

showlogEl.onchange=()=>{logEl.classList.toggle('show',showlogEl.checked)};

async function sendChat(text){
  try{
    const res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
    const r=await res.json();
    logEl.textContent=(logEl.textContent.split('\n').slice(-20).join('\n')+'\n> '+text+'\n'+r.reply).trim();
    logEl.scrollTop=1e9;
  }catch(e){
    logEl.textContent+='\nError: '+e.message;
  }
}

sendBtn.onclick=()=>{const t=qEl.value.trim();if(t){sendChat(t);qEl.value=''}};
qEl.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();sendBtn.click()}};

// Resize
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

// Animate
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}

// Update camera panels (if enabled)
function updateCameraPanels(){
  if(rs1dEl.checked){
    const img=document.getElementById('rs1d-img');
    img.src='/cam/rs1_depth.jpg?t='+Date.now();
  }
  if(rs1cEl.checked){
    const img=document.getElementById('rs1c-img');
    img.src='/cam/rs1_color.jpg?t='+Date.now();
  }
  if(rs2dEl.checked){
    const img=document.getElementById('rs2d-img');
    img.src='/cam/rs2_depth.jpg?t='+Date.now();
  }
  if(rs2cEl.checked){
    const img=document.getElementById('rs2c-img');
    img.src='/cam/rs2_color.jpg?t='+Date.now();
  }
}

setInterval(updateCameraPanels,200);  // 5 Hz camera panel updates

loadScene();
pollState();
animate();
</script>
