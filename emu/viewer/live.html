<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kevin Live Sim</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#ddd;font:14px system-ui;overflow:hidden;height:100vh}
#c{display:block;width:100%;height:100%}
#hud{position:fixed;top:8px;left:8px;background:#0008;padding:6px 10px;border-radius:4px;font-size:12px;pointer-events:none}
#chat{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;display:flex;padding:8px;gap:8px}
#chat input{flex:1;background:#222;border:1px solid #444;color:#fff;padding:8px;font:14px system-ui}
#chat button{background:#0a5;border:none;color:#fff;padding:8px 20px;cursor:pointer;font:14px system-ui}
#chat button:hover{background:#0b6}
#log{position:fixed;bottom:60px;left:8px;right:8px;max-height:200px;overflow:auto;background:#0008;padding:6px;font:11px monospace;white-space:pre-wrap;display:none}
#log.show{display:block}
#controls{position:fixed;top:8px;right:8px;background:#0008;padding:6px;border-radius:4px;display:flex;flex-direction:column;gap:4px}
#controls label{font-size:11px;display:flex;align-items:center;cursor:pointer}
#controls input[type=checkbox]{margin-right:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">Kevin Live Sim · Drag to orbit · Scroll to zoom</div>
<div id="controls">
<label><input type="checkbox" id="camvis" checked> Camera frustums</label>
<label><input type="checkbox" id="showdog"> Show dog marker</label>
<label><input type="checkbox" id="showlog"> Show log</label>
<button id="framehouse" style="background:#0008;border:1px solid #666;color:#ddd;padding:4px 8px;cursor:pointer;font-size:11px;margin-top:4px">Frame house</button>
</div>
<div id="log"></div>
<div id="chat">
<input id="q" placeholder="go to couch | forward 2 | turn left | stop" autocomplete="off">
<button id="send">Send</button>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const canvas=document.getElementById('c');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);  // sky blue

const camera=new THREE.PerspectiveCamera(50,window.innerWidth/window.innerHeight,0.1,200);
camera.position.set(-3,2.5,4);

const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const controls=new OrbitControls(camera,canvas);
controls.target.set(0,0,0);
controls.enableDamping=true;
controls.dampingFactor=0.05;
controls.update();

// Lights - bright outdoor lighting
const hemi=new THREE.HemisphereLight(0xffffff,0x666666,0.8);
scene.add(hemi);
const ambient=new THREE.AmbientLight(0xffffff,0.6);
scene.add(ambient);
const dir=new THREE.DirectionalLight(0xffffff,1.0);
dir.position.set(5,10,7);
dir.castShadow=true;
dir.shadow.camera.left=-20;dir.shadow.camera.right=20;
dir.shadow.camera.top=20;dir.shadow.camera.bottom=-20;
dir.shadow.mapSize.width=2048;dir.shadow.mapSize.height=2048;
scene.add(dir);

// Ground - will be resized based on scene extent
let ground=new THREE.Mesh(
  new THREE.PlaneGeometry(30,30),
  new THREE.MeshStandardMaterial({color:0x4a4a4a,roughness:0.8})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// Grid helper for reference
let grid=new THREE.GridHelper(30,30,0x666666,0x444444);
grid.position.y=0.01;
scene.add(grid);

// State
let sceneLoaded=false;
let sceneExtent=null;
let robot=null,frustums=[];
const camvisEl=document.getElementById('camvis');
const showdogEl=document.getElementById('showdog');

// MuJoCo Z-up to Three.js Y-up coordinate transform
function mjToThree(x,y,z){return[x,z,-y]}

// Robot - dark chassis + mast stub + yellow arrow
const robotGroup=new THREE.Group();
// Chassis (dark box)
const chassisGeom=new THREE.BoxGeometry(0.5,0.15,0.4);
const chassisMat=new THREE.MeshStandardMaterial({color:0x2a2e33,roughness:0.7});
const chassis=new THREE.Mesh(chassisGeom,chassisMat);
chassis.position.y=0.075;
chassis.castShadow=true;
robotGroup.add(chassis);
// Mast stub (small vertical cylinder)
const mastGeom=new THREE.CylinderGeometry(0.03,0.03,0.15,8);
const mastMat=new THREE.MeshStandardMaterial({color:0x2a2e33,roughness:0.7});
const mast=new THREE.Mesh(mastGeom,mastMat);
mast.position.set(0,0.15+0.075,0);
mast.castShadow=true;
robotGroup.add(mast);
// Yellow heading arrow
const arrowHelper=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(0,0.1,0),0.5,0xffff00,0.15,0.1);
robotGroup.add(arrowHelper);
robot=robotGroup;
scene.add(robot);

// Dog marker (small sphere) - OFF by default
const dogGeom=new THREE.SphereGeometry(0.15,16,16);
const dogMat=new THREE.MeshStandardMaterial({color:0x8a5});
const dog=new THREE.Mesh(dogGeom,dogMat);
dog.position.y=0.15;
dog.visible=false;
scene.add(dog);
showdogEl.onchange=()=>{if(!dog.userData.present)dog.visible=false;else dog.visible=showdogEl.checked};

// Goal marker
const goalGeom=new THREE.ConeGeometry(0.08,0.25,8);
const goalMat=new THREE.MeshStandardMaterial({color:0xf00,emissive:0x800});
const goal=new THREE.Mesh(goalGeom,goalMat);
goal.position.y=0.125;
goal.visible=false;
scene.add(goal);

// Path line
const pathMat=new THREE.LineBasicMaterial({color:0xfa0,linewidth:2});
const path=new THREE.Line(new THREE.BufferGeometry(),pathMat);
scene.add(path);

// Camera frustums (optional)
function makeFrustum(color){
  const group=new THREE.Group();
  const mat=new THREE.LineBasicMaterial({color,transparent:true,opacity:0.5});
  
  // Pyramid outline
  const points=[
    new THREE.Vector3(0,0,0),new THREE.Vector3(-0.3,-0.2,-0.6),
    new THREE.Vector3(0,0,0),new THREE.Vector3(0.3,-0.2,-0.6),
    new THREE.Vector3(0,0,0),new THREE.Vector3(0.3,0.2,-0.6),
    new THREE.Vector3(0,0,0),new THREE.Vector3(-0.3,0.2,-0.6),
    new THREE.Vector3(-0.3,-0.2,-0.6),new THREE.Vector3(0.3,-0.2,-0.6),
    new THREE.Vector3(0.3,-0.2,-0.6),new THREE.Vector3(0.3,0.2,-0.6),
    new THREE.Vector3(0.3,0.2,-0.6),new THREE.Vector3(-0.3,0.2,-0.6),
    new THREE.Vector3(-0.3,0.2,-0.6),new THREE.Vector3(-0.3,-0.2,-0.6)
  ];
  const geom=new THREE.BufferGeometry().setFromPoints(points);
  const line=new THREE.LineSegments(geom,mat);
  group.add(line);
  group.visible=false;
  return group;
}

camvisEl.onchange=()=>{frustums.forEach(f=>f.visible=camvisEl.checked&&sceneLoaded)};
showdogEl.onchange();

// Frame house button
function frameHouse(){
  if(!sceneExtent)return;
  const[xmin,ymin,xmax,ymax]=sceneExtent;
  const w=xmax-xmin,h=ymax-ymin;
  const cx=(xmin+xmax)/2,cy=(ymin+ymax)/2;
  const dist=Math.max(w,h)*0.8;
  camera.position.set(cx-dist*0.6,dist*0.5,cy+dist*0.6);
  controls.target.set(cx,0,cy);
  controls.update();
}
document.getElementById('framehouse').onclick=frameHouse;

// Load scene geometry
async function loadScene(){
  try{
    const res=await fetch('/scene.json');
    const data=await res.json();
    console.log('Scene data:',data);
    
    // Update floor and grid based on extent
    if(data.extent){
      sceneExtent=data.extent;
      const[xmin,ymin,xmax,ymax]=data.extent;
      const w=xmax-xmin,h=ymax-ymin;
      const cx=(xmin+xmax)/2,cy=(ymin+ymax)/2;
      console.log(`Scene extent: ${w.toFixed(1)}m x ${h.toFixed(1)}m @ (${cx.toFixed(1)}, ${cy.toFixed(1)})`);
      
      // Resize ground - larger than scene
      scene.remove(ground);
      const groundSize=Math.max(w,h)+8;
      ground=new THREE.Mesh(
        new THREE.PlaneGeometry(groundSize,groundSize),
        new THREE.MeshStandardMaterial({color:0x4a4a4a,roughness:0.8})
      );
      ground.rotation.x=-Math.PI/2;
      ground.position.set(cx,0,cy);
      ground.receiveShadow=true;
      scene.add(ground);
      
      // Resize grid
      scene.remove(grid);
      grid=new THREE.GridHelper(groundSize,Math.ceil(groundSize),0x666666,0x444444);
      grid.position.set(cx,0.01,cy);
      scene.add(grid);
      
      // Auto-frame on load
      frameHouse();
    }
    
    // Add geometry from scene
    let meshCount=0,boxCount=0,cylCount=0;
    data.geoms.forEach(g=>{
      if(g.kind==='box'){
        boxCount++;
        const geom=new THREE.BoxGeometry(g.size[0]*2,g.size[2]*2,g.size[1]*2);
        const color=g.color||0x888888;
        const mat=new THREE.MeshStandardMaterial({color,roughness:0.7});
        const mesh=new THREE.Mesh(geom,mat);
        const[x,y,z]=mjToThree(g.pos[0],g.pos[1],g.pos[2]);
        mesh.position.set(x,y,z);
        mesh.rotation.y=-g.yaw;
        mesh.castShadow=true;
        mesh.receiveShadow=true;
        scene.add(mesh);
      }else if(g.kind==='cyl'){
        cylCount++;
        const geom=new THREE.CylinderGeometry(g.size[0],g.size[0],g.size[1]*2,16);
        const color=g.color||0x888888;
        const mat=new THREE.MeshStandardMaterial({color,roughness:0.6});
        const mesh=new THREE.Mesh(geom,mat);
        const[x,y,z]=mjToThree(g.pos[0],g.pos[1],g.pos[2]);
        mesh.position.set(x,y,z);
        mesh.castShadow=true;
        mesh.receiveShadow=true;
        scene.add(mesh);
      }else if(g.kind==='mesh'&&g.vertices&&g.faces){
        // Mesh (e.g. walls from trimesh)
        meshCount++;
        console.log(`Loading mesh: ${g.vertices.length} verts, ${g.faces.length} faces`);
        const geom=new THREE.BufferGeometry();
        const verts=[];const norms=[];
        g.faces.forEach(f=>{
          const v0=g.vertices[f[0]],v1=g.vertices[f[1]],v2=g.vertices[f[2]];
          const[x0,y0,z0]=mjToThree(v0[0],v0[1],v0[2]);
          const[x1,y1,z1]=mjToThree(v1[0],v1[1],v1[2]);
          const[x2,y2,z2]=mjToThree(v2[0],v2[1],v2[2]);
          verts.push(x0,y0,z0,x1,y1,z1,x2,y2,z2);
          // Compute normal
          const a=new THREE.Vector3(x1-x0,y1-y0,z1-z0);
          const b=new THREE.Vector3(x2-x0,y2-y0,z2-z0);
          const n=new THREE.Vector3().crossVectors(a,b).normalize();
          norms.push(n.x,n.y,n.z,n.x,n.y,n.z,n.x,n.y,n.z);
        });
        geom.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
        geom.setAttribute('normal',new THREE.Float32BufferAttribute(norms,3));
        const color=g.color||0xdcd8cc;
        const mat=new THREE.MeshStandardMaterial({color,roughness:0.7,side:THREE.DoubleSide,transparent:true,opacity:0.88});
        const mesh=new THREE.Mesh(geom,mat);
        mesh.castShadow=true;
        mesh.receiveShadow=true;
        scene.add(mesh);
      }
    });
    console.log(`Scene loaded: ${meshCount} meshes, ${boxCount} boxes, ${cylCount} cylinders`);
    
    sceneLoaded=true;
  }catch(e){
    console.error('Failed to load scene:',e);
  }
}

// Polled state (tunnel-friendly)
function updateState(st){
  try{
    // Update robot
    if(st.kevin){
      const[x,y,z]=mjToThree(st.kevin[0],st.kevin[1],0);
      robot.position.set(x,y,z);
      robot.rotation.y=-st.kevin[2];
    }
    
    // Update dog
    if(st.dog){
      const[x,y,z]=mjToThree(st.dog[0],st.dog[1],0);
      dog.position.set(x,0.15,z);
      dog.userData.present=true;
      dog.visible=showdogEl.checked;
    }else{
      dog.userData.present=false;
      dog.visible=false;
    }
    
    // Update goal
    if(st.goal){
      const[x,y,z]=mjToThree(st.goal[0],st.goal[1],0);
      goal.position.set(x,0.125,z);
      goal.visible=true;
    }else{
      goal.visible=false;
    }
    
    // Update path
    if(st.path&&st.path.length>0){
      const points=st.path.map(p=>{
        const[x,y,z]=mjToThree(p[0],p[1],0);
        return new THREE.Vector3(x,0.02,z);
      });
      path.geometry.dispose();
      path.geometry=new THREE.BufferGeometry().setFromPoints(points);
      path.visible=true;
    }else{
      path.visible=false;
    }
    
  }catch(e){console.error('State update error:',e)}
}

async function pollState(){
  try{
    const res=await fetch('/state.json');
    const st=await res.json();
    updateState(st);
  }catch(e){console.error('Poll error:',e)}
  setTimeout(pollState,50);
}

// Chat
const qEl=document.getElementById('q');
const sendBtn=document.getElementById('send');
const logEl=document.getElementById('log');
const showlogEl=document.getElementById('showlog');

showlogEl.onchange=()=>{logEl.classList.toggle('show',showlogEl.checked)};

async function sendChat(text){
  try{
    const res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
    const r=await res.json();
    logEl.textContent=(logEl.textContent.split('\n').slice(-20).join('\n')+'\n> '+text+'\n'+r.reply).trim();
    logEl.scrollTop=1e9;
  }catch(e){
    logEl.textContent+='\nError: '+e.message;
  }
}

sendBtn.onclick=()=>{const t=qEl.value.trim();if(t){sendChat(t);qEl.value=''}};
qEl.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();sendBtn.click()}};

// Resize
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

// Animate
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}

loadScene();
pollState();
animate();
</script>
</body>
</html>
