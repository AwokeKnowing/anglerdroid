<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>rl_nav watch</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: ui-sans-serif, system-ui, sans-serif;
      background: #111318; color: #e8e8ea;
      height: 100vh; overflow: hidden;
    }
    header { padding: 12px 20px 8px; }
    .head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
    h1 { font-size: 18px; font-weight: 650; margin: 0 0 4px; }
    .sub { color: #9aa0aa; font-size: 13px; }
    .when {
      text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .when b { display: block; font-size: 16px; font-weight: 650; }
    .when span { color: #9aa0aa; font-size: 12px; }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      gap: 12px;
      padding: 0 16px 12px;
      height: calc(100vh - 58px);
      min-height: 0;
      align-items: stretch;
    }
    figure {
      margin: 0; background: #0d0f14; border-radius: 12px; overflow: hidden;
      border: 1px solid #2a2e38; display: flex; flex-direction: column;
      min-height: 0; height: max-content; max-height: 100%;
    }
    figcaption { padding: 6px 12px; font-size: 12px; color: #b4b8c0; flex: 0 0 auto; }
    video {
      width: 100%; height: auto; max-height: calc(100vh - 96px);
      display: block; background: #000; object-fit: contain;
    }
    .panel {
      min-width: 0; min-height: 0; height: 100%; overflow: auto;
      display: flex; flex-direction: column; gap: 8px;
      padding-right: 4px;
    }
    .stats {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }
    .stat {
      background: #1b1e26; border: 1px solid #2a2e38; border-radius: 8px;
      padding: 6px 8px;
    }
    .stat b { display: block; font-size: 14px; }
    .stat span { color: #9aa0aa; font-size: 10px; text-transform: uppercase; letter-spacing: .03em; }
    .chart {
      background: #1b1e26; border: 1px solid #2a2e38; border-radius: 10px;
      padding: 8px 10px 4px;
    }
    .chart h2 {
      margin: 0 0 4px; font-size: 12px; font-weight: 600; color: #c8ccd4;
    }
    .chart canvas { width: 100%; height: 96px; display: block; }
    #gate {
      position: fixed; inset: 0; background: rgba(8,10,14,.82);
      display: flex; align-items: center; justify-content: center; z-index: 5;
    }
    #gate.hid { display: none; }
    button {
      font-size: 18px; padding: 14px 22px; border-radius: 12px; border: 0;
      background: #3d7eff; color: #fff; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="gate"><button id="go">Click once to start live watch</button></div>
  <header>
    <div class="head">
      <div>
        <h1>rl_nav env0</h1>
        <div class="sub" id="sub">Left: 1× / 15× / 1× episode. Right: live PPO.</div>
      </div>
      <div class="when" id="when"><b>Updated —</b><span>waiting for clip</span></div>
    </div>
  </header>
  <div class="layout">
    <figure>
      <video id="ep" muted playsinline></video>
      <figcaption id="cap">Full episode — 1× / 15× / 1×</figcaption>
    </figure>
    <div class="panel">
      <div class="stats" id="stats"></div>
      <div class="chart"><h2>Cover vs crash</h2><canvas id="c-frac"></canvas></div>
      <div class="chart"><h2>Fog tiles vs visitable ceiling</h2><canvas id="c-hits"></canvas></div>
      <div class="chart"><h2>PPO loss</h2><canvas id="c-loss"></canvas></div>
      <div class="chart"><h2>Episode return vs ceiling</h2><canvas id="c-ret"></canvas></div>
      <div class="chart"><h2>Entropy</h2><canvas id="c-ent"></canvas></div>
    </div>
  </div>
  <script>
    const ep = document.getElementById("ep");
    const stats = document.getElementById("stats");
    const whenEl = document.getElementById("when");
    const subEl = document.getElementById("sub");
    const capEl = document.getElementById("cap");
    let started = false;
    let shownM = 0;
    let pendingM = 0;
    let packS = 89;
    const keys = [
      ["step", "step"], ["sps", "sps"], ["cover", "cover"], ["crash", "crash"],
      ["path", "path m"], ["hits", "hits"], ["liveh", "live hits"],
      ["ent", "entropy"], ["loss", "ppo loss"], ["ret", "return"],
      ["stg", "stage"], ["play_s", "pack s"],
    ];
    function fmt(k, v) {
      if (typeof v !== "number" || !isFinite(v)) return "—";
      if (k === "step") return v >= 1e6 ? (v / 1e6).toFixed(1) + "M" : v.toFixed(0);
      if (k === "play_s") return v.toFixed(0) + "s";
      if (Math.abs(v) >= 100) return v.toFixed(0);
      if (k === "loss" || k === "ret") return v.toFixed(3);
      return v.toFixed(3);
    }
    function clock(ts) {
      if (!ts) return "—";
      const d = new Date(ts * 1000);
      if (!isFinite(d.getTime())) return "—";
      return d.toLocaleString(undefined, {
        month: "short", day: "numeric", hour: "numeric", minute: "2-digit",
        second: "2-digit",
      });
    }
    function age(ts) {
      if (!ts) return "";
      const s = Math.max(0, (Date.now() / 1000) - ts);
      if (s < 90) return Math.round(s) + "s ago";
      if (s < 3600) return Math.round(s / 60) + "m ago";
      return (s / 3600).toFixed(1) + "h ago";
    }
    function loadClip(m) {
      if (!m) return;
      shownM = m;
      ep.src = "last_ep.mp4?t=" + m;
      if (started) ep.play().catch(() => {});
    }
    function paint(s) {
      stats.innerHTML = keys.map(([k, lab]) =>
        `<div class="stat"><b>${fmt(k, s[k])}</b><span>${lab}</span></div>`
      ).join("");
    }
    function paintWhen(s) {
      const m = s.mtime || 0;
      const play = s.play_s || packS;
      const mx = s.pack_max_s || 89;
      packS = play || packS;
      whenEl.innerHTML = `<b>Updated ${clock(m)}</b><span>${age(m)} · this pack ${play.toFixed(0)}s · max ${mx.toFixed(0)}s</span>`;
      subEl.textContent = "1× / 15× / 1× (5s wall, middle 15×, 5s wall). A 20 min episode packs to ~" + mx.toFixed(0)
        + "s. New clip swaps as soon as encode finishes.";
      capEl.textContent = (s.how ? (s.how + " · ") : "")
        + "cover " + ((s.ep_cover != null) ? (100 * s.ep_cover).toFixed(0) + "%" : "?")
        + " — 1× / 15× / 1× — " + play.toFixed(0) + "s pack";
    }
    function chart(id, labels, series, opt) {
      opt = opt || {};
      const cv = document.getElementById(id);
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const w = cv.clientWidth || 320;
      const h = cv.clientHeight || 96;
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);
      const g = cv.getContext("2d");
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, w, h);
      const pad = { l: 36, r: 8, t: 8, b: 22 };
      const iw = w - pad.l - pad.r;
      const ih = h - pad.t - pad.b;
      const n = labels.length;
      let lo = Infinity, hi = -Infinity;
      for (const s of series) for (const v of s.data) {
        if (v == null || !isFinite(v)) continue;
        lo = Math.min(lo, v); hi = Math.max(hi, v);
      }
      if (!isFinite(lo)) return;
      if (opt.min != null) lo = opt.min;
      if (opt.max != null) hi = opt.max;
      if (opt.zero && lo > 0) lo = 0;
      if (hi === lo) { hi += 1; lo -= (opt.min != null ? 0 : 1); }
      const span = hi - lo || 1;
      if (opt.min == null && !opt.zero) lo -= span * 0.08;
      if (opt.max == null) hi += span * 0.08;
      g.strokeStyle = "#2a2e38"; g.lineWidth = 1;
      g.beginPath();
      g.moveTo(pad.l, pad.t); g.lineTo(pad.l, pad.t + ih); g.lineTo(pad.l + iw, pad.t + ih);
      g.stroke();
      g.fillStyle = "#8b909a"; g.font = "10px ui-sans-serif, system-ui";
      g.textAlign = "right";
      for (let i = 0; i < 3; i++) {
        const y = pad.t + ih * (1 - i / 2);
        const v = lo + (hi - lo) * (i / 2);
        g.fillText(Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(2), pad.l - 4, y + 3);
      }
      if (n > 1) {
        g.textAlign = "left"; g.fillText(labels[0], pad.l, h - 6);
        g.textAlign = "right"; g.fillText(labels[n - 1], pad.l + iw, h - 6);
      }
      const xAt = (i) => pad.l + (n <= 1 ? iw / 2 : iw * i / (n - 1));
      const yAt = (v) => pad.t + ih * (1 - (v - lo) / (hi - lo));
      for (const s of series) {
        g.strokeStyle = s.color; g.lineWidth = 1.6; g.beginPath();
        let pen = false;
        s.data.forEach((v, i) => {
          if (v == null || !isFinite(v)) { pen = false; return; }
          const x = xAt(i), y = yAt(v);
          if (!pen) g.moveTo(x, y); else g.lineTo(x, y);
          pen = true;
        });
        g.stroke();
      }
      g.font = "10px ui-sans-serif, system-ui";
      let lx = pad.l + 6, ly = pad.t + 10;
      g.textAlign = "left";
      for (const s of series) {
        g.fillStyle = s.color;
        g.fillRect(lx, ly - 6, 8, 8);
        g.fillStyle = "#b4b8c0";
        g.fillText(s.name, lx + 12, ly);
        lx += 12 + g.measureText(s.name).width + 14;
      }
    }
    function draw(s) {
      const ser = s.series || {};
      const lab = ser.labels || [];
      chart("c-frac", lab, [
        { name: "cover", data: ser.cover || [], color: "#6ee7a8" },
        { name: "crash", data: ser.crash || [], color: "#f07178" },
      ], { min: 0, max: 1 });
      chart("c-hits", lab, [
        { name: "hits", data: ser.hits || [], color: "#7ab8ff" },
        { name: "ceiling", data: ser.ceil || [], color: "#8adf8a" },
      ], { zero: true });
      chart("c-loss", lab, [
        { name: "loss", data: ser.loss || [], color: "#f0c674" },
      ]);
      chart("c-ret", lab, [
        { name: "return", data: ser.ret || [], color: "#82aaff" },
        { name: "ceiling", data: ser.ret_ceil || [], color: "#8adf8a" },
      ]);
      chart("c-ent", lab, [
        { name: "entropy", data: ser.ent || [], color: "#c792ea" },
      ], { zero: true });
    }
    async function tick() {
      let s = {};
      try { s = await (await fetch("stats.json?t=" + Date.now())).json(); }
      catch (e) { return; }
      paint(s);
      paintWhen(s);
      draw(s);
      const m = s.mtime || 0;
      if (m) pendingM = m;
      if (m && m !== shownM) loadClip(m);
    }
    ep.addEventListener("ended", () => {
      if (pendingM && pendingM !== shownM) loadClip(pendingM);
      else ep.play().catch(() => {});
    });
    document.getElementById("go").onclick = () => {
      started = true;
      document.getElementById("gate").classList.add("hid");
      ep.play().catch(() => {});
      tick();
    };
    window.addEventListener("resize", () => { if (window._lastS) draw(window._lastS); });
    const _draw = draw;
    draw = (s) => { window._lastS = s; _draw(s); };
    setInterval(tick, 2000);
    tick();
  </script>
</body>
</html>
