%YAML:1.0

# Kevin RS2 D435i stereo IR @ 848x480 (SDK-rectified).
# fx/fy/cx/cy are fallbacks; live values also ride on the TCP header.
# RS2 emitter is OFF; RS1 top-down laser stays ON for depth. Tracker
# median-blurs IR (ORBSLAM3_SPECKLE_K, default 5) so ORB does not lock
# onto RS1 projector dots on the floor.
File.version: "1.0"

Camera.type: "Rectified"

Camera1.fx: 424.0
Camera1.fy: 424.0
Camera1.cx: 424.0
Camera1.cy: 240.0

Stereo.b: 0.05

Camera.width: 848
Camera.height: 480
Camera.fps: 30
Camera.RGB: 1

Stereo.ThDepth: 40.0

System.SaveAtlasToFile: "/home/james/.kevin/orbslam3/atlas"

ORBextractor.nFeatures: 1250
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0
