<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Kevin — MakerBeam XL Twin v199</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1a1d24;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e8eaed;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #c { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 10px 14px;
      padding-top: max(10px, env(safe-area-inset-top));
      background: linear-gradient(180deg, rgba(0,0,0,0.65), transparent);
      pointer-events: none;
      z-index: 10;
    }
    #hud h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
    #hud p { font-size: 11px; opacity: 0.7; margin-top: 2px; }
    #status {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 10px 14px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      font-size: 12px;
      background: linear-gradient(0deg, rgba(0,0,0,0.6), transparent);
      z-index: 10;
      pointer-events: none;
    }
    #toolbar {
      position: fixed; bottom: 52px; right: 12px;
      display: flex; flex-direction: column; gap: 8px;
      z-index: 11;
    }
    #toolbar button {
      width: 44px; height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(30,34,42,0.9);
      color: #e8eaed;
      font-size: 18px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      touch-action: manipulation;
    }
    #toolbar button:active { background: rgba(60,70,90,0.95); }
    #err {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      max-width: 90vw; padding: 16px 20px;
      background: #3a1a1a; border: 1px solid #a44; border-radius: 10px;
      font-size: 13px; display: none; z-index: 20; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="hud">
    <h1>Kevin · MakerBeam XL twin v2</h1>
    <p>Drag to orbit · Pinch/scroll to zoom · Two-finger pan</p>
  </div>
  <canvas id="c"></canvas>
  <div id="status">Loading URDF…</div>
  <div id="toolbar">
    <button id="btn-reset" title="Reset camera">↺</button>
    <button id="btn-axes" title="Toggle axes">⌖</button>
    <button id="btn-grid" title="Toggle grid">▦</button>
  </div>
  <div id="err"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "urdf-loader": "https://cdn.jsdelivr.net/npm/urdf-loader@0.12.3/src/URDFLoader.js"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import URDFLoader from 'urdf-loader';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';

    const statusEl = document.getElementById('status');
    const errEl = document.getElementById('err');
    const canvas = document.getElementById('c');

    function setStatus(msg) { statusEl.textContent = msg; }
    function showError(msg) {
      errEl.style.display = 'block';
      errEl.textContent = msg;
      setStatus('Error');
    }

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    } catch (e) {
      showError('WebGL unavailable in this browser/context.\n' + e.message);
      throw e;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1d24);
    scene.fog = new THREE.Fog(0x1a1d24, 4, 12);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.001, 50);
    camera.position.set(0.85, 0.65, 0.95);

    const controls = new OrbitControls(camera, canvas);
    controls.target.set(0, 0.25, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 0.02;
    controls.maxDistance = 8;
    controls.maxPolarAngle = Math.PI * 0.92;
    controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
    controls.update();

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.45));
    const key = new THREE.DirectionalLight(0xffffff, 1.1);
    key.position.set(2, 4, 2);
    key.castShadow = true;
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xaabbff, 0.35);
    fill.position.set(-2, 1, -1);
    scene.add(fill);
    const hemi = new THREE.HemisphereLight(0xddeeff, 0x332211, 0.35);
    scene.add(hemi);

    // Ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(6, 6),
      new THREE.MeshStandardMaterial({ color: 0x2a2e38, roughness: 0.95, metalness: 0.05 })
    );
    ground.rotation.x = -Math.PI / 2;
    // Place ground at wheel contact: base_link z=0 is axle height = 0.0855 m
    ground.position.y = -0.08565;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(4, 40, 0x4a5568, 0x2f3540);
    grid.position.y = -0.08555;
    scene.add(grid);

    const axes = new THREE.AxesHelper(0.35);
    axes.position.set(0, 0, 0);
    scene.add(axes);

    let showAxes = true;
    let showGrid = true;

    document.getElementById('btn-reset').onclick = () => {
      camera.position.set(0.85, 0.65, 0.95);
      controls.target.set(0, 0.25, 0);
      controls.update();
    };
    document.getElementById('btn-axes').onclick = () => {
      showAxes = !showAxes;
      axes.visible = showAxes;
    };
    document.getElementById('btn-grid').onclick = () => {
      showGrid = !showGrid;
      grid.visible = showGrid;
    };

    // URDF uses Z-up; Three.js uses Y-up — rotate the robot group
    const robotGroup = new THREE.Group();
    robotGroup.rotation.x = -Math.PI / 2; // Z-up → Y-up
    scene.add(robotGroup);

    const manager = new THREE.LoadingManager();
    const loader = new URDFLoader(manager);
    loader.packages = '';
    // Project root (parent of /viewer/) so mesh paths like meshes/botwheel.stl resolve
    loader.workingPath = new URL('../', window.location.href).href;
    loader.parseVisual = true;
    loader.parseCollision = false;

    const stlLoader = new STLLoader(manager);
    loader.loadMeshCb = (path, mgr, done) => {
      const url = path.startsWith('http') ? path : new URL(path, loader.workingPath).href;
      stlLoader.load(
        url,
        (geometry) => {
          // Default STL tint is charcoal; Anker hub must read as the same near-black as URDF boxes
          const isAnker = /anker_usb_hub/i.test(path) || /anker_usb_hub/i.test(url);
          const isHousing = /odrive_housing_cover/i.test(path) || /odrive_housing_cover/i.test(url);
          const isCanClear = /canable_clear_top/i.test(path) || /canable_clear_top/i.test(url);
          let color = 0x222428, roughness = 0.85, metalness = 0.15, opacity = 1.0;
          if (isAnker) { color = 0x0a0a0d; roughness = 0.55; metalness = 0.05; }
          if (isHousing) {
            color = 0x8c8c94; roughness = 0.35; metalness = 0.05; opacity = 0.90;
          }
          if (isCanClear) {
            color = 0xd1e0f0; roughness = 0.25; metalness = 0.0; opacity = 0.90;
          }
          const mat = new THREE.MeshStandardMaterial({
            color, roughness, metalness, opacity, transparent: opacity < 1
          });
          const mesh = new THREE.Mesh(geometry, mat);
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          done(mesh);
        },
        undefined,
        (err) => {
          console.error('STL load failed', url, err);
          done(null, err);
        }
      );
    };

    const urdfUrl = new URL('../urdf/kevin.urdf?v=218', window.location.href).href;

    fetch(urdfUrl)
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status} fetching ${urdfUrl}`);
        return r.text();
      })
      .then(text => {
        const robot = loader.parse(text);
        robot.traverse(c => {
          if (c.isMesh) {
            c.castShadow = true;
            c.receiveShadow = true;
            // Ensure materials respect opacity for clear ODrive cases
            if (c.material) {
              if (Array.isArray(c.material)) {
                c.material.forEach(m => { if (m.opacity < 1) { m.transparent = true; m.depthWrite = false; } });
              } else if (c.material.opacity < 1) {
                c.material.transparent = true;
                c.material.depthWrite = false;
              }
            }
          }
        });
        robotGroup.add(robot);

        // Fit camera to robot bounds
        const box = new THREE.Box3().setFromObject(robotGroup);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        controls.target.copy(center);
        camera.position.set(center.x + maxDim * 1.1, center.y + maxDim * 0.7, center.z + maxDim * 1.2);
        controls.update();

        const links = Object.keys(robot.links || {}).length;
        const joints = Object.keys(robot.joints || {}).length;
        setStatus(`Kevin loaded · ${links} links · ${joints} joints · track 0.32 m · mast ~0.8 m`);
      })
      .catch(err => {
        console.error(err);
        showError(
          'Failed to load URDF.\n\n' +
          err.message + '\n\n' +
          'Serve from project root:\n' +
          '  cd /workspace/kevin-urdf-twin\n' +
          '  python3 -m http.server 8080\n' +
          'Then open http://HOST:8080/viewer/'
        );
      });

    function onResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', () => setTimeout(onResize, 200));

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
