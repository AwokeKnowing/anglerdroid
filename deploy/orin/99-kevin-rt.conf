# Kevin safety core priority on the Orin: allow nice -10 (nav/safety_core.py _realtime falls back to os.nice(-10)
# when SCHED_FIFO is denied).  rtprio stays 0 ON PURPOSE: in the 2026-10-20 10-min stationary soaks SCHED_FIFO 50 on
# cpu 7 was worse (late>50 ms decisions 295 vs 19, RS1 frames dropped 2 vs 0, inop_cadence 3 vs 0), because every
# librealsense/WheelBase thread the core starts inherits FIFO 50 on the same cpu and they no longer time-slice.
# Install on the Orin: sudo cp deploy/orin/99-kevin-rt.conf /etc/security/limits.d/ (takes effect at next login)
# Rollback: sudo rm /etc/security/limits.d/99-kevin-rt.conf
jetbot - rtprio 0
jetbot - nice -10
